version: '3.8'

services:
  web:
    build: .
    container_name: sru_blockchain_voting
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secret-key-blockchain-sru-2026
      - TRANSACTIONS_PER_BLOCK=1
      - PUZZLE=000
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=465
      - EMAIL_ADDRESS=${EMAIL_ADDRESS}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    volumes:
      - db_data:/app/db_storage

volumes:
  db_data:

